<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>⚔️ Clash Royale Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #0a0e27; overflow: hidden; font-family: Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; }
        canvas { display: block; border: 2px solid #00ff00; box-shadow: 0 0 20px rgba(0,255,0,0.3); max-width: 100vw; max-height: 100vh; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
// ⚔️ CLASH ROYALE WEB - VANILLA JS ULTRA-OPTIMIZADO
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
canvas.width = 960;
canvas.height = 640;

const CONFIG = { BATTLE_TIME: 180, MAX_ELIXIR: 10, ELIXIR_REGEN: 2.8, TOWER_HP: 1000 };
const LANE_X = [320, 480, 640];
const CARDS = {
    knight: { name: 'Knight', cost: 3, hp: 100, dmg: 20, spd: 80, rng: 30, icon: '🗡️', type: 'troop' },
    archers: { name: 'Archers', cost: 3, hp: 60, dmg: 15, spd: 70, rng: 120, icon: '🏹', type: 'troop' },
    giant: { name: 'Giant', cost: 5, hp: 300, dmg: 40, spd: 40, rng: 50, icon: '👹', type: 'troop' },
    dragon: { name: 'Dragon', cost: 6, hp: 200, dmg: 35, spd: 60, rng: 100, icon: '🐉', type: 'troop' },
    wizard: { name: 'Wizard', cost: 4, hp: 70, dmg: 25, spd: 75, rng: 150, icon: '🧙', type: 'troop' },
    skeletons: { name: 'Skeletons', cost: 1, hp: 20, dmg: 8, spd: 100, rng: 30, icon: '💀', type: 'troop' },
    bomb_tower: { name: 'Bomb Tower', cost: 4, hp: 250, dmg: 50, spd: 0, rng: 180, icon: '💣', type: 'building' },
    fireball: { name: 'Fireball', cost: 4, dmg: 80, rng: 200, icon: '🔥', type: 'spell' },
    arrow_spell: { name: 'Arrows', cost: 2, dmg: 40, rng: 300, icon: '⬆️', type: 'spell' },
    lightning: { name: 'Lightning', cost: 5, dmg: 150, rng: 250, icon: '⚡', type: 'spell' },
};

const DECK = ['knight', 'archers', 'skeletons', 'bomb_tower', 'fireball', 'arrow_spell', 'wizard', 'giant'];

class Unit {
    constructor(x, y, cardId, isPlayer) {
        const card = CARDS[cardId];
        this.x = x; this.y = y; this.vx = 0; this.vy = 0;
        this.hp = card.hp; this.dmg = card.dmg; this.spd = card.spd || 60; this.rng = card.rng;
        this.icon = card.icon; this.isPlayer = isPlayer; this.target = null; this.lastAttack = 0;
    }
    update(dt, enemies, towers) {
        if (this.hp <= 0) return false;
        if (!this.target || this.target.hp <= 0) {
            let minDist = Infinity;
            [...enemies, ...towers].forEach(t => {
                const d = Math.hypot(t.x - this.x, t.y - this.y);
                if (d < minDist) { minDist = d; this.target = t; }
            });
        }
        if (this.target) {
            const dx = this.target.x - this.x, dy = this.target.y - this.y, dist = Math.hypot(dx, dy);
            if (dist > this.rng) {
                const norm = dist > 0 ? 1 / dist : 0;
                this.vx = dx * norm * this.spd; this.vy = dy * norm * this.spd;
            } else {
                this.vx *= 0.8; this.vy *= 0.8;
                if (Date.now() - this.lastAttack > 500) {
                    this.target.hp -= this.dmg;
                    this.lastAttack = Date.now();
                }
            }
        } else {
            this.vx = (this.isPlayer ? -1 : 1) * 60;
            this.vy = 0;
        }
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.x = Math.max(50, Math.min(910, this.x));
        this.y = Math.max(50, Math.min(590, this.y));
        return true;
    }
    draw(ctx) {
        ctx.fillStyle = this.isPlayer ? '#00ff00' : '#ff0000';
        ctx.beginPath(); ctx.arc(this.x, this.y, 16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
        ctx.fillText(this.icon, this.x, this.y);
        const hpRatio = this.hp / CARDS[Object.keys(CARDS).find(k => CARDS[k].icon === this.icon)].hp;
        ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.25 ? '#fa0' : '#f00';
        ctx.fillRect(this.x - 20, this.y - 26, 40 * hpRatio, 3);
    }
}

class Tower {
    constructor(x, y, isPlayer) {
        this.x = x; this.y = y; this.hp = CONFIG.TOWER_HP; this.isPlayer = isPlayer;
    }
    draw(ctx) {
        ctx.fillStyle = this.isPlayer ? '#0f0' : '#f00';
        ctx.fillRect(this.x - 15, this.y - 30, 30, 45);
        const ratio = this.hp / CONFIG.TOWER_HP;
        ctx.fillStyle = ratio > 0.5 ? '#0f0' : ratio > 0.25 ? '#fa0' : '#f00';
        ctx.fillRect(this.x - 25, this.y - 40, 50 * ratio, 4);
    }
}

class Player {
    constructor(isPlayer) {
        this.isPlayer = isPlayer;
        this.units = [];
        this.towers = [new Tower(480, isPlayer ? 580 : 60, isPlayer), new Tower(320, isPlayer ? 580 : 60, isPlayer), new Tower(640, isPlayer ? 580 : 60, isPlayer)];
        this.elixir = 5; this.hand = [];
        for (let i = 0; i < 4; i++) this.hand.push(DECK[Math.floor(Math.random() * DECK.length)]);
        this.lastElixir = Date.now();
    }
    playCard(cardId, lane) {
        const card = CARDS[cardId];
        if (this.elixir < card.cost) return false;
        this.elixir -= card.cost;
        const x = LANE_X[lane], y = this.isPlayer ? 500 : 140;
        this.units.push(new Unit(x, y, cardId, this.isPlayer));
        this.hand.splice(this.hand.indexOf(cardId), 1);
        this.hand.push(DECK[Math.floor(Math.random() * DECK.length)]);
        return true;
    }
    update(dt, enemy) {
        if (Date.now() - this.lastElixir > CONFIG.ELIXIR_REGEN * 1000 && this.elixir < CONFIG.MAX_ELIXIR) {
            this.elixir++; this.lastElixir = Date.now();
        }
        this.units = this.units.filter(u => u.update(dt, enemy.units, enemy.towers));
        this.towers = this.towers.filter(t => t.hp > 0);
    }
    getTotalHP() { return this.towers.reduce((s, t) => s + t.hp, 0); }
    draw(ctx) { this.towers.forEach(t => t.draw(ctx)); this.units.forEach(u => u.draw(ctx)); }
}

class Game {
    constructor() {
        this.state = 'menu';
        this.player = null;
        this.enemy = null;
        this.time = 0;
        this.selectedCard = null;
        this.result = null;
        this.lastAI = 0;
    }
    start() {
        this.state = 'battle';
        this.player = new Player(true);
        this.enemy = new Player(false);
        this.time = CONFIG.BATTLE_TIME;
        this.lastAI = Date.now();
    }
    update(dt) {
        if (this.state !== 'battle') return;
        this.player.update(dt, this.enemy);
        this.enemy.update(dt, this.player);
        if (Date.now() - this.lastAI > 2000) {
            const card = this.enemy.hand[Math.floor(Math.random() * 4)];
            this.enemy.playCard(card, Math.floor(Math.random() * 3));
            this.lastAI = Date.now();
        }
        this.time -= dt;
        if (this.time <= 0 || this.player.towers.length === 0 || this.enemy.towers.length === 0) {
            this.result = this.player.getTotalHP() > this.enemy.getTotalHP() ? 'WIN' : this.player.getTotalHP() < this.enemy.getTotalHP() ? 'LOSE' : 'TIE';
            this.state = 'result';
        }
    }
    draw(ctx) {
        ctx.fillStyle = '#0f1929';
        ctx.fillRect(0, 0, 960, 640);
        ctx.strokeStyle = '#1a2540';
        for (let i = 0; i < 4; i++) ctx.strokeRect(240 * i, 0, 240, 640);
        if (this.state === 'menu') {
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('⚔️ CLASH ROYALE', 480, 150);
            ctx.fillStyle = '#fff';
            ctx.font = '24px Arial';
            ctx.fillText('Toca para jugar', 480, 350);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(380, 400, 200, 60);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 28px Arial';
            ctx.fillText('JUGAR', 480, 440);
        } else if (this.state === 'battle') {
            this.player.draw(ctx);
            this.enemy.draw(ctx);
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`${Math.floor(this.time / 60)}:${Math.floor(this.time % 60).toString().padStart(2, '0')}`, 480, 30);
            ctx.font = '18px Arial';
            ctx.fillText(`⚡${Math.floor(this.player.elixir)}/${CONFIG.MAX_ELIXIR}`, 80, 50);
            ctx.fillStyle = '#f00';
            ctx.fillText(`⚡${Math.floor(this.enemy.elixir)}/${CONFIG.MAX_ELIXIR}`, 880, 50);
            this.drawHand(ctx);
        } else {
            const c = { WIN: '#0f0', LOSE: '#f00', TIE: '#ff0' }[this.result];
            const t = { WIN: '¡VICTORIA! 🎉', LOSE: '¡DERROTA! 😞', TIE: 'EMPATE 🤝' }[this.result];
            ctx.fillStyle = c;
            ctx.font = 'bold 56px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(t, 480, 200);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(380, 350, 200, 60);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 28px Arial';
            ctx.fillText('MENÚ', 480, 390);
        }
    }
    drawHand(ctx) {
        const h = this.player.hand;
        const w = 80, hh = 100, s = 10;
        const sx = (960 - h.length * (w + s)) / 2;
        h.forEach((id, i) => {
            const x = sx + i * (w + s), y = 540;
            ctx.fillStyle = this.selectedCard === id ? '#0f0' : '#2d3561';
            ctx.fillRect(x, y, w, hh);
            ctx.strokeStyle = this.selectedCard === id ? '#ff0' : '#0f0';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, hh);
            ctx.font = '28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(CARDS[id].icon, x + w / 2, y + 35);
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 14px Arial';
            ctx.fillText(CARDS[id].cost, x + 10, y + 15);
            this.cardBounds = this.cardBounds || [];
            this.cardBounds[i] = { x, y, w, hh, card: id };
        });
    }
    click(x, y) {
        if (this.state === 'menu' && x > 380 && x < 580 && y > 400 && y < 460) this.start();
        else if (this.state === 'battle') {
            this.cardBounds?.forEach(cb => {
                if (x > cb.x && x < cb.x + cb.w && y > cb.y && y < cb.y + cb.hh) {
                    this.selectedCard = this.selectedCard === cb.card ? null : cb.card;
                }
            });
            if (this.selectedCard && y < 300) {
                const lane = Math.floor((x / 960) * 3);
                this.player.playCard(this.selectedCard, lane);
                this.selectedCard = null;
            }
        } else if (this.state === 'result' && x > 380 && x < 580 && y > 350 && y < 410) this.state = 'menu';
    }
}

const game = new Game();
let lastT = Date.now();
function loop() {
    const now = Date.now();
    game.update((now - lastT) / 1000);
    game.draw(ctx);
    lastT = now;
    requestAnimationFrame(loop);
}
canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    game.click(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('touchend', e => {
    const r = canvas.getBoundingClientRect(), t = e.changedTouches[0];
    game.click(t.clientX - r.left, t.clientY - r.top);
});
loop();
    </script>
</body>
</html>
